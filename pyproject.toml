[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[project]
name = "chessmentor"
version = "0.1.1"

description = "Chess training and analysis tools"
readme = "README.md"

requires-python = ">=3.10"

license = { text = "Apache-2.0" }

authors = [
    { name = "Kostas Messinis", email = "messinisk@gmail.com" }
]

keywords = [
    "chess",
    "analysis",
    "training",
    "coach",
    "engine"
]

classifiers = [
    "Development Status :: 3 - Alpha",

    "Intended Audience :: Developers",
    "Intended Audience :: Education",

    "License :: OSI Approved :: Apache Software License",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Topic :: Games/Entertainment :: Board Games"
]

dependencies = [
    "python-chess>=1.999",
]

[project.optional-dependencies]

dev = [
    "pytest",
    "ruff",
    "mypy",
    "pytest-cov>=7.1.0",
]

security = [
    "bandit"
]

docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocs-get-deps",
    "mkdocs-material-extensions"
]

release = [
    "build",
    "twine"

]


[project.urls]
Homepage = "https://github.com/messinisk/ChessMentor"
Repository = "https://github.com/messinisk/ChessMentor"
Issues = "https://github.com/messinisk/ChessMentor/issues"
Documentation = "https://messinisk.github.io/ChessMentor"
